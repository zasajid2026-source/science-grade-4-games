<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Science for Grade 4 — Games</title>
<link rel="icon" href="data:,">
<style>
  *{margin:0;padding:0;box-sizing:border-box;}
  body{font-family:"Comic Neue","Baloo 2","Comic Sans MS","Chalkboard SE","Segoe UI Rounded",ui-rounded,system-ui,sans-serif;
    background:linear-gradient(180deg,#E3F2F3,#FFF7E0); color:#1F2430; min-height:100vh; text-align:center;}
  body::before, body::after{
    content:""; position:fixed; left:0; right:0; height:14px; z-index:5; pointer-events:none;
    background-image:
      radial-gradient(circle at 10px 7px, #0E7C86 4.5px, transparent 5px),
      radial-gradient(circle at 34px 7px, #E8A020 4.5px, transparent 5px),
      radial-gradient(circle at 58px 7px, #0A5C66 4.5px, transparent 5px);
    background-size:72px 14px; background-repeat:repeat-x;
  }
  body::before{top:0;} body::after{bottom:0;}
  header{padding:30px 14px 6px;}
  .book{font-size:15px; font-weight:800; letter-spacing:2.5px; color:#0A5C66;}
  h1{font-size:clamp(26px,7vw,38px); font-weight:800; color:#0A5C66; margin-top:2px;}
  .tag{font-size:16.5px; font-weight:700; color:#47606F; margin-top:6px;}
  .hero{width:min(88vw,430px); border-radius:26px; border:4px solid #fff;
    box-shadow:0 12px 28px rgba(10,92,102,.22); margin:14px auto 4px; display:block;}
  .wrap{max-width:640px; margin:0 auto; padding:14px;}
  .unit{font-size:15px; font-weight:800; letter-spacing:1.5px; color:#fff;
    border-radius:999px; padding:8px 16px; margin:18px 0 12px;}
  .unit small{display:block; font-size:12.5px; letter-spacing:.5px; font-weight:700; opacity:.85;}
  .grid{display:grid; grid-template-columns:repeat(2,1fr); gap:12px;}
  @media(min-width:520px){.grid{grid-template-columns:repeat(3,1fr);}}
  .card{background:#fff; border-radius:20px; padding:16px 10px 14px; box-shadow:0 6px 16px rgba(10,92,102,.14);
    text-decoration:none; color:#1F2430; display:block; border:3px solid #E3F2F3;
    transition:transform .15s;}
  .card:active{transform:scale(.97);}
  .card .n{font-size:12.5px; font-weight:800; letter-spacing:1.5px;}
  .card .p{font-size:11.5px; font-weight:800; letter-spacing:.5px; margin-top:2px;}
  .card .t{font-size:17.5px; font-weight:800; line-height:1.2; margin-top:3px; color:#1F2430;}
  .card .play{display:inline-block; margin-top:9px; color:#fff; font-weight:800;
    border-radius:999px; padding:7px 18px; font-size:15px;}
  footer{padding:8px 14px 30px; font-size:13.5px; font-weight:700; color:#47606F; line-height:1.6;}
  footer .credit{color:#8A6D1C; font-size:13px;}
</style>
</head>
<body>
<header>
  <div class="book">SCIENCE — GRADE 4</div>
  <h1>🎮 Science for Grade 4 — Games</h1>
  <p class="tag">One game for every chapter — Mia the little scientist plays with you!<br>Scan the QR code in your book, then tap your chapter.</p>
</header>
<img class="hero" src="img/hero-g4.jpg" alt="Mia and her friends exploring science">
<div class="wrap" id="wrap"></div>
<footer>
  Free to play · No ads · No logins — just play together.<br>
  <span class="credit">✦ Prepared by: Zulfiqar Ali Sajid ✦</span>
</footer>
<script>
var PARTS = [{"part": 1, "name": "PART 1", "title": "Life Sciences", "col": "#0E7C86", "deep": "#0A5C66", "chapters": ["Germs: The Tiny Troublemakers", "Eat Well, Grow Strong", "Life Cycles: Growing and Changing", "Food Chains and the Flow of Energy", "Decomposers: Nature's Clean-Up Crew"]}, {"part": 2, "name": "PART 2", "title": "Energy, Sound, Light and Sparks", "col": "#43A047", "deep": "#2E7031", "chapters": ["Heat All Around Us", "The World of Sound", "Light Helps Us See", "Shadows, Beams and Mirrors", "Magnets: Attract and Repel", "Static Sparks"]}, {"part": 3, "name": "PART 3", "title": "Forces and Matter", "col": "#E85D3D", "deep": "#B23A1F", "chapters": ["Forces: Pushes and Pulls", "How Things Move", "Matter: Solids, Liquids and Gases", "Melt, Freeze, Disappear!", "Changes We Can Undo — and Those We Can't"]}, {"part": 4, "name": "PART 4", "title": "Earth and Space", "col": "#6C4FD8", "deep": "#4A32A8", "chapters": ["Our Solar System", "Energy Resources for Our Future", "The Water Cycle", "Soil Erosion: When the Soil Slips Away"]}];
var wrap = document.getElementById("wrap");
var cn = 0;
PARTS.forEach(function(p){
  var h = document.createElement("div");
  h.className = "unit";
  h.style.background = p.col;
  h.innerHTML = p.name + "<small>" + p.title + "</small>";
  wrap.appendChild(h);
  var grid = document.createElement("div");
  grid.className = "grid";
  wrap.appendChild(grid);
  p.chapters.forEach(function(title){
    cn++;
    var n = cn;
    var a = document.createElement("a");
    a.className = "card"; a.href = "c" + n + ".html";
    a.innerHTML = '<div class="n" style="color:' + p.col + '">CHAPTER ' + n + '</div>' +
      '<div class="p" style="color:' + p.deep + '">' + p.name + ' · ' + p.title + '</div>' +
      '<div class="t">' + title + '</div>' +
      '<span class="play" style="background:' + p.col + '; box-shadow:0 4px 0 ' + p.deep + '">▶ Play!</span>';
    grid.appendChild(a);
  });
});
</script>
</body>
</html>
